spring.application.name=servicenow-consumer

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tracebridge}
spring.datasource.username=${DB_USERNAME:tracebridge}
spring.datasource.password=${DB_PASSWORD:tracebridge}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=servicenow_consumer

spring.flyway.enabled=true
spring.flyway.schemas=servicenow_consumer
spring.flyway.default-schema=servicenow_consumer

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:servicenow-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

tracebridge.kafka.topic.service-request-created=servicenow.service-request
tracebridge.supported-sources=CUSTOMER_PORTAL

servicenow.base-url=${SERVICENOW_BASE_URL:}
servicenow.username=${SERVICENOW_USERNAME:}
servicenow.password=${SERVICENOW_PASSWORD:}
servicenow.connect-timeout-ms=${SERVICENOW_CONNECT_TIMEOUT_MS:5000}
servicenow.read-timeout-ms=${SERVICENOW_READ_TIMEOUT_MS:10000}

logging.level.org.apache.kafka=WARN
