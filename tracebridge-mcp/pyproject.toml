[project]
name = "tracebridge-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing TraceBridge investigation evidence from OpenSearch and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "opensearch-py>=2.7.1",
    "psycopg[binary]>=3.2.1",
    "docker>=7.1.0",
]

[project.scripts]
tracebridge-mcp = "tracebridge_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
