spring.application.name=customer-db-consumer

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/customer_db}
spring.datasource.username=${DB_USERNAME:tracebridge}
spring.datasource.password=${DB_PASSWORD:tracebridge}
# Kept short and explicit rather than HikariCP's 30s default: when
# customer-postgres is stopped for the Phase 8 failure demo, a fast,
# well-defined connection timeout is what produces a clean, promptly
# observable CONNECTION_REFUSED/TIMEOUT failure instead of each event
# hanging for half a minute.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=customer_db_consumer

spring.flyway.enabled=true
spring.flyway.schemas=customer_db_consumer
spring.flyway.default-schema=customer_db_consumer

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:customer-db-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Same topic servicenow-consumer consumes - both are independent consumer
# groups on the same event, not a chain of one consumer into the other.
tracebridge.kafka.topic.service-request-created=servicenow.service-request
tracebridge.supported-sources=CUSTOMER_PORTAL

logging.level.org.apache.kafka=WARN
