[project]
name = "tracebridge-investigator"
version = "0.1.0"
description = "Read-only AI investigation agent for TraceBridge, grounded entirely in MCP evidence"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
tracebridge-investigator = "tracebridge_investigator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
