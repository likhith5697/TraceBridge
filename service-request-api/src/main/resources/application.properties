spring.application.name=service-request-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tracebridge}
spring.datasource.username=${DB_USERNAME:tracebridge}
spring.datasource.password=${DB_PASSWORD:tracebridge}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Default is 60000ms - far too long for a poller meant to retry every ~1s.
# Found live: with the default, send() itself blocks for a full 60s waiting
# on topic metadata when Kafka is unreachable, throwing Kafka's own
# unchecked org.apache.kafka.common.errors.TimeoutException directly (not
# the java.util.concurrent.TimeoutException a bare Future.get() would throw).
spring.kafka.producer.properties.max.block.ms=5000

tracebridge.kafka.topic.service-request-created=servicenow.service-request

# Outbox poller (see OutboxPublisher): how often it checks for unsent
# events, and the max number it publishes per cycle.
tracebridge.outbox.poll-interval-ms=1000
tracebridge.outbox.batch-size=50

logging.level.org.apache.kafka=WARN